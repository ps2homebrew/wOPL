name: Archive existing GitHub releases to MEGA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inventory only, or download and upload every current release asset
        required: true
        default: inventory
        type: choice
        options:
          - inventory
          - archive

permissions:
  contents: read

jobs:
  archive-existing-releases:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      USERNAME: ${{ secrets.MEGA_USERNAME }}
      PASSWORD: ${{ secrets.MEGA_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect release inventory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p archive-inventory

          # --slurp returns one array per API page. jq add flattens those pages
          # into one complete array containing every current GitHub release.
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq 'add | sort_by(.published_at // .created_at)' \
            > archive-inventory/releases.json

          jq -r '
            ["release_id","tag","name","prerelease","draft","published_at","asset_count","asset_bytes","url"],
            (.[] | [
              .id,
              .tag_name,
              (.name // ""),
              .prerelease,
              .draft,
              (.published_at // ""),
              (.assets | length),
              ([.assets[].size] | add // 0),
              .html_url
            ]) | @csv
          ' archive-inventory/releases.json > archive-inventory/releases.csv

          RELEASE_COUNT="$(jq 'length' archive-inventory/releases.json)"
          ASSET_COUNT="$(jq '[.[].assets | length] | add // 0' archive-inventory/releases.json)"
          TOTAL_BYTES="$(jq '[.[].assets[].size] | add // 0' archive-inventory/releases.json)"
          TOTAL_HUMAN="$(numfmt --to=iec-i --suffix=B "${TOTAL_BYTES}")"

          cat > archive-inventory/INVENTORY-SUMMARY.txt <<EOF
          Repository: ${GITHUB_REPOSITORY}
          Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Releases: ${RELEASE_COUNT}
          Attached assets: ${ASSET_COUNT}
          Total attached asset size: ${TOTAL_BYTES} bytes (${TOTAL_HUMAN})
          EOF

          {
            echo "## Existing release inventory"
            echo
            echo "- Releases: **${RELEASE_COUNT}**"
            echo "- Attached assets: **${ASSET_COUNT}**"
            echo "- Download size: **${TOTAL_HUMAN}**"
            echo
            if [ "${{ inputs.mode }}" = "inventory" ]; then
              echo "Inventory mode was selected. Nothing was downloaded from GitHub or uploaded to MEGA."
            else
              echo "Archive mode was selected. The next steps will download and archive these assets."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inventory report
        uses: actions/upload-artifact@v6
        with:
          name: wOPL-release-inventory
          path: archive-inventory/
          retention-days: 30

      - name: Check MEGA credentials
        if: inputs.mode == 'archive'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${USERNAME}" ] || [ -z "${PASSWORD}" ]; then
            echo "MEGA_USERNAME and MEGA_PASSWORD repository secrets must be configured first."
            exit 1
          fi

      - name: Download every existing release asset
        if: inputs.mode == 'archive'
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_ROOT="Historical-Releases"
          mkdir -p "${ARCHIVE_ROOT}/Pre-Release" "${ARCHIVE_ROOT}/Release"
          cp archive-inventory/releases.json "${ARCHIVE_ROOT}/RELEASES.json"
          cp archive-inventory/releases.csv "${ARCHIVE_ROOT}/RELEASES.csv"
          cp archive-inventory/INVENTORY-SUMMARY.txt "${ARCHIVE_ROOT}/INVENTORY-SUMMARY.txt"

          jq -r '.[] | [.id, .tag_name, .prerelease, .draft, (.assets | length)] | @tsv' \
            archive-inventory/releases.json \
          | while IFS=$'\t' read -r RELEASE_ID TAG IS_PRERELEASE IS_DRAFT ASSET_COUNT; do
              if [ "${IS_DRAFT}" = "true" ]; then
                echo "Skipping draft release: ${TAG}"
                continue
              fi

              if [ "${IS_PRERELEASE}" = "true" ]; then
                CATEGORY="Pre-Release"
              else
                CATEGORY="Release"
              fi

              SAFE_TAG="$(printf '%s' "${TAG}" | sed -e 's#[/\\:*?"<>|]#_#g')"
              DEST="${ARCHIVE_ROOT}/${CATEGORY}/${SAFE_TAG}"
              mkdir -p "${DEST}/assets"

              echo "Archiving ${TAG} (${ASSET_COUNT} assets) -> ${DEST}"

              jq --argjson release_id "${RELEASE_ID}" '
                .[]
                | select(.id == $release_id)
                | {
                    id,
                    tag_name,
                    name,
                    draft,
                    prerelease,
                    created_at,
                    published_at,
                    target_commitish,
                    html_url,
                    body,
                    assets: [.assets[] | {
                      id,
                      name,
                      label,
                      content_type,
                      size,
                      download_count,
                      created_at,
                      updated_at,
                      browser_download_url
                    }]
                  }
              ' archive-inventory/releases.json > "${DEST}/RELEASE-METADATA.json"

              if [ "${ASSET_COUNT}" -gt 0 ]; then
                gh release download "${TAG}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --dir "${DEST}/assets" \
                  --clobber

                (
                  cd "${DEST}"
                  find assets -type f -print0 \
                    | sort -z \
                    | xargs -0 sha256sum \
                    > SHA256SUMS.txt
                )
              else
                printf 'This GitHub release had no attached binary assets.\n' \
                  > "${DEST}/NO-ATTACHED-ASSETS.txt"
              fi
          done

          LOCAL_BYTES="$(du -sb "${ARCHIVE_ROOT}" | cut -f1)"
          LOCAL_HUMAN="$(numfmt --to=iec-i --suffix=B "${LOCAL_BYTES}")"
          FILE_COUNT="$(find "${ARCHIVE_ROOT}" -type f | wc -l)"

          {
            echo
            echo "### Prepared historical archive"
            echo
            echo "- Local archive files: **${FILE_COUNT}**"
            echo "- Local archive size: **${LOCAL_HUMAN}**"
            echo "- MEGA destination: \`/wOPL/Historical-Releases/\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload historical archive to MEGA
        if: inputs.mode == 'archive'
        uses: Difegue/action-megacmd@1.4.0
        with:
          args: put -c Historical-Releases /wOPL/
        env:
          USERNAME: ${{ secrets.MEGA_USERNAME }}
          PASSWORD: ${{ secrets.MEGA_PASSWORD }}

      - name: Confirm MEGA archive size
        if: inputs.mode == 'archive'
        uses: Difegue/action-megacmd@1.4.0
        with:
          args: du /wOPL/Historical-Releases
        env:
          USERNAME: ${{ secrets.MEGA_USERNAME }}
          PASSWORD: ${{ secrets.MEGA_PASSWORD }}

      - name: Archive completion summary
        if: inputs.mode == 'archive'
        shell: bash
        run: |
          {
            echo
            echo "### Upload complete"
            echo
            echo "The existing GitHub release assets were uploaded to \`/wOPL/Historical-Releases/\`."
            echo "Do not delete GitHub releases until you have opened the MEGA folder and spot-checked several old builds."
          } >> "$GITHUB_STEP_SUMMARY"
