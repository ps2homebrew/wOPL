name: Update Downloads Badge

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *" # every 12 hours to reduce PR churn
  release:
    types: [published, edited, deleted]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: downloads-badge
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch (wOPL-base)
        uses: actions/checkout@v4
        with:
          ref: wOPL-base
          fetch-depth: 0

      - name: Compute total downloads + write badges/downloads.json
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const path = require("path");

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Sum assets[].download_count across ALL releases (paginate)
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            let total = 0;
            for (const rel of releases) {
              for (const a of (rel.assets || [])) {
                total += Number(a.download_count || 0);
              }
            }

            core.info(`Computed total downloads: ${total}`);

            // Shields endpoint schema
            // https://shields.io/endpoint
            const badge = {
              schemaVersion: 1,
              label: "DOUBLE UNOFFICIAL OPEN PS2 LOADER | TOTAL DOWNLOADS:",
              message: String(total),          // FULL NUMBER
              labelColor: "faf9f6",
              color: "blue"
            };

            fs.mkdirSync("badges", { recursive: true });
            fs.writeFileSync(
              path.join("badges", "downloads.json"),
              JSON.stringify(badge),
              "utf8"
            );

      - name: Create or update PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: wOPL-base
          branch: bot/downloads-badge
          delete-branch: false
          title: "chore(badges): update downloads badge"
          commit-message: "chore(badges): update downloads badge"
          body: |
            Automated update of `badges/downloads.json` (Shields endpoint) based on summed GitHub release asset downloads.
          add-paths: |
            badges/downloads.json
